<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10151f"><meta name="description" content="AI.MALDIVES — your AI assistant">
  <title>AI.MALDIVES</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">M</div><div><b>AI.MALDIVES</b><small>Your AI companion</small></div></div>
    <button class="new-chat" id="newChat">＋ <span>New chat</span></button>
    <div class="side-label">RECENT CHATS</div><div id="chatList" class="chat-list"></div>
    <div class="side-bottom"><div class="status-dot"></div><span id="statusText">Checking connection…</span></div>
  </aside>
  <main class="main">
    <header class="topbar"><button class="icon-btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><div class="top-title">AI Assistant</div><div class="top-actions"><span class="online-pill"><i></i> AI online</span></div></header>
    <section class="content">
      <div class="welcome" id="welcome">
        <div class="hero-orb">✦</div><p class="eyebrow">WELCOME TO YOUR AI</p>
        <h1>What can I help<br><span>you with today?</span></h1>
        <p class="sub">Ask anything, create images, or upload a file to explore ideas together.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Explain a difficult topic in simple words."><span>✧</span><b>Learn something</b><small>Explain a topic simply</small></button>
          <button class="suggestion" data-prompt="Help me write a professional email."><span>✎</span><b>Write something</b><small>Emails, ideas and more</small></button>
          <button class="suggestion" data-prompt="Give me creative ideas for a project."><span>✦</span><b>Get creative</b><small>Brainstorm new ideas</small></button>
        </div>
      </div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="imagePanel" class="image-panel"></div>
    </section>
    <footer class="composer-wrap">
      <div class="file-chip" id="fileChip" hidden><span>📎</span><span id="fileName"></span><button id="removeFile" aria-label="Remove file">×</button></div>
      <div class="composer">
        <button class="tool-btn" id="attachBtn" title="Upload file">＋</button><input id="fileInput" type="file" hidden accept=".pdf,.docx,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.log">
        <textarea id="prompt" rows="1" placeholder="Message AI.MALDIVES…" aria-label="Message"></textarea>
        <button class="tool-btn" id="imageBtn" title="Generate an image">▧</button>
        <button class="tool-btn" id="voiceBtn" title="Voice input">🎙</button>
        <button class="send-btn" id="sendBtn" aria-label="Send">↑</button>
      </div>
      <div class="footnote">AI.MALDIVES can make mistakes. Check important information.</div>
    </footer>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body></html>
